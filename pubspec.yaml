name: yuitodo
description: "YuiTodo - A beautiful task management app"
publish_to: 'none'
version: 3.1.5+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: 华康少女文字W5
      fonts:
        - asset: assets/fonts/华康少女文字W5.ttf
    - family: 恋星圆体
      fonts:
        - asset: assets/fonts/恋星圆体.ttf
    - family: LOGO圆体
      fonts:
        - asset: assets/fonts/LOGO圆体.ttf
    - family: 萌神手写体
      fonts:
        - asset: assets/fonts/萌神手写体.ttf
    - family: 字体家AI造字福楷
      fonts:
        - asset: assets/fonts/字体家AI造字福楷.ttf
    - family: MapleMono
      fonts:
        - asset: assets/fonts/MapleMono-Regular.ttf
        - asset: assets/fonts/MapleMono-Bold.ttf
          weight: 700
    - family: FiraCodeNerdFontMono
      fonts:
        - asset: assets/fonts/FiraCodeNerdFontMono-Regular.ttf
        - asset: assets/fonts/FiraCodeNerdFontMono-Bold.ttf
          weight: 700
    - family: ArkPixel
      fonts:
        - asset: assets/fonts/ark-pixel-10px-monospaced-zh_cn.ttf
