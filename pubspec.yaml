name: yuitodo
description: "YuiTodo - A beautiful task management app"
publish_to: 'none'
version: 4.5.1+27

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  flutter_riverpod: ^2.5.1
  intl: ^0.20.3
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_local_notifications:
    path: packages/flutter_local_notifications
  timezone: ^0.9.4
  package_info_plus: ^8.0.0
  flutter_slidable: ^4.0.3
  table_calendar: ^3.1.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: SourceHanSansSC
      fonts:
        - asset: assets/fonts/open/SourceHanSansSC-Regular.otf
    - family: SmileySans
      fonts:
        - asset: assets/fonts/open/SmileySans-Oblique.ttf
    - family: LXGWWenKaiLite
      fonts:
        - asset: assets/fonts/open/LXGWWenKaiLite-Regular.ttf
    - family: IBMPlexSansSC
      fonts:
        - asset: assets/fonts/open/IBMPlexSansSC-Regular.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/open/IBMPlexMono-Regular.ttf
    - family: 华康少女文字W5
      fonts:
        - asset: assets/fonts/华康少女文字W5.ttf
    - family: 恋星圆体
      fonts:
        - asset: assets/fonts/恋星圆体.ttf
    - family: LOGO圆体
      fonts:
        - asset: assets/fonts/LOGO圆体.ttf
    - family: 萌神手写体
      fonts:
        - asset: assets/fonts/萌神手写体.ttf
    - family: 字体家AI造字福楷
      fonts:
        - asset: assets/fonts/字体家AI造字福楷.ttf
    - family: MapleMono
      fonts:
        - asset: assets/fonts/MapleMono-Regular.ttf
        - asset: assets/fonts/MapleMono-Bold.ttf
          weight: 700
    - family: FiraCodeNerdFontMono
      fonts:
        - asset: assets/fonts/FiraCodeNerdFontMono-Regular.ttf
        - asset: assets/fonts/FiraCodeNerdFontMono-Bold.ttf
          weight: 700
    - family: ArkPixel
      fonts:
        - asset: assets/fonts/ark-pixel-10px-monospaced-zh_cn.ttf
